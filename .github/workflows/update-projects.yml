name: Update Projects

on:
  push:
    branches:
    - publish       # Trigger on changes to the 'publish' branch
    #paths:
    #- 'projects/**' # Trigger only when changes happen in the projects folder

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Generate paths JSON
        run: |
          node generatePaths.js

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add -f projects-paths.json devlogs-paths.json products-paths.json
          git commit -m "Auto-generated path JSON files." || echo "No changes to commit"
          git push https://github.com/${{ github.repository }}.git HEAD:publish