<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devlog</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/devlog.css">
    <script defer src="/js/devlog.js"></script>
    <script defer src="/js/imageLoader.js"></script>
    <script defer src="/js/videoLoader.js"></script>
    <script defer src="/js/documentLoader.js"></script>
    <script defer src="/js/sourceLoader.js"></script>
    <script defer src="/js/elementLoader.js"></script>
</head>

<body>
    <header>
        <a href="home.html">← Back to project overview</a>
        <h1 id="devlog-title">Loading...</h1>
        <p id="devlog-dates"></p>
    </header>
    
    <main>
        <section>
            <h2>Goal</h2>
            <strong id="devlog-goalName"></strong>
            <p id="devlog-goal"></p>
        </section>
        <section>
            <h2>Approach</h2>
            <ul id="devlog-approach"></ul>
        </section>
        <section id="devlog-normal-learning-section">
            <h2>Normal Learning Outcomes</h2>
            <ul id="devlog-normal-learning"></ul>
        </section>
        <section id="devlog-special-learning-section">
            <h2>Special Learning Outcomes</h2>
            <ul id="devlog-special-learning"></ul>
        </section>
        <section>
            <h2>Result</h2>
            <p id="devlog-result"></p>
        </section>
        <section>
            <h2>Validation</h2>
            <p id="devlog-validation"></p>
        </section>
        <section>
            <h2>Contribution</h2>
            <p id="devlog-contribution"></p>
        </section>
    </main>
</body>

</html>
